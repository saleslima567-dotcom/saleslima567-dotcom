<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f3ec" />
    <meta name="description" content="Painel demonstrativo para gestão escolar: alunos, turmas, frequência e notas." />
    <title>Raiz — Gestão escolar</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%231d3936'/%3E%3Cpath d='M10 28V12h5v6l6-6h7l-8 7 8 9h-7l-6-7v7z' fill='%23c9ed78'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./styles.css" />
    <script src="./app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Navegação principal">
        <a class="brand" href="#inicio" data-view="dashboard" aria-label="Raiz, início">
          <span class="brand-mark" aria-hidden="true">r.</span>
          <span class="brand-copy"><strong>raiz</strong><small>gestão escolar</small></span>
        </a>

        <div class="school-switcher">
          <span class="school-avatar" aria-hidden="true">H</span>
          <span class="school-copy"><strong>Escola Horizonte</strong><small>Unidade Centro</small></span>
          <span class="switch-chevron" aria-hidden="true">⌄</span>
        </div>

        <p class="nav-label">MENU PRINCIPAL</p>
        <nav class="nav-list" aria-label="Seções do sistema">
          <button class="nav-link active" data-view="dashboard"><span class="nav-icon">⌂</span><span>Visão geral</span></button>
          <button class="nav-link" data-view="students"><span class="nav-icon">◉</span><span>Alunos</span><span class="nav-count" id="student-nav-count">0</span></button>
          <button class="nav-link" data-view="classes"><span class="nav-icon">▦</span><span>Turmas</span></button>
          <button class="nav-link" data-view="attendance"><span class="nav-icon">✓</span><span>Frequência</span></button>
          <button class="nav-link" data-view="grades"><span class="nav-icon">⌁</span><span>Notas</span></button>
          <button class="nav-link" data-view="teachers"><span class="nav-icon">♙</span><span>Professores</span></button>
        </nav>

        <div class="sidebar-bottom">
          <div class="term-card"><span class="term-dot"></span><div><strong>Ano letivo 2026</strong><small>3º trimestre · em andamento</small></div><span class="term-arrow">↗</span></div>
          <button class="nav-link help-link" id="help-button"><span class="nav-icon">?</span><span>Sobre a demonstração</span></button>
          <div class="user-card"><span class="user-avatar">KS</span><span class="user-copy"><strong>Coordenação</strong><small>Perfil demonstrativo</small></span><button class="more-button" id="reset-button" aria-label="Restaurar dados de demonstração" title="Restaurar dados de demonstração">•••</button></div>
        </div>
      </aside>

      <main class="main-area">
        <header class="topbar">
          <div class="breadcrumb"><span>Escola Horizonte</span><span class="crumb-divider">/</span><strong id="current-section">Visão geral</strong></div>
          <div class="topbar-actions">
            <span class="today-label" id="today-label"></span>
            <button class="icon-button notification-button" id="notification-button" aria-label="Notificações"><span aria-hidden="true">♧</span><i></i></button>
            <span class="top-avatar" aria-label="Coordenação">KS</span>
          </div>
        </header>

        <div class="page-content" id="page-content" tabindex="-1"></div>
      </main>
    </div>

    <dialog class="app-dialog" id="app-dialog" aria-labelledby="dialog-title">
      <form method="dialog" class="dialog-frame" id="dialog-form">
        <div class="dialog-top"><div><p class="eyebrow" id="dialog-eyebrow">CADASTRO</p><h2 id="dialog-title">Novo aluno</h2></div><button class="icon-button close-dialog" value="cancel" aria-label="Fechar">×</button></div>
        <div class="dialog-body" id="dialog-body"></div>
        <div class="dialog-actions" id="dialog-actions"></div>
      </form>
    </dialog>
    <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>
  </body>
</html>
